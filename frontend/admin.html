<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logue em sua conta</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="menu-de-navegacao">
            <nav class="logotipo">
                <img src="imagens/ui/cdm2.png">
            </nav>
                <a href="index.html">Home</a>
        </nav>
    </header>
    <div class="logotipo-admin">
        <img src="imagens/ui/cdm2.png">
    </div>

    <div class="login-container">
        <h1>Acesso</h1>
        <p>
            <h2>Usuário</h2>
        </p>
        <input id="usuario" type="text">
        
        <h2>Senha</h2>

        <div class="senha-container">
            
            <input id="senha" type="password">
                
            <button onclick="alternar_visualizacao()" id="visualizar-senha" type="button"></button>
        
        </div>

        <button id="login" type="button">Login</button>

    </div>

    <script>
        let visualizacao = false

        function alternar_visualizacao() {
            if (visualizacao === false) {
                visualizacao = true
                let input_senha = document.getElementById("senha");
                input_senha.type = "text";
                let imagem_olho = document.getElementById("visualizar-senha");
                imagem_olho.style.backgroundImage = 'url("imagens/olho.png")';
            }

            else {
                visualizacao = false
                let input_senha = document.getElementById("senha");
                input_senha.type = "password";
                let imagem_olho = document.getElementById("visualizar-senha");
                imagem_olho.style.backgroundImage = 'url("imagens/olho-bloqueado.png")';
            }      
        }
    </script>
</body>
</html>

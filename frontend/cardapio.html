<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Cardápio</title>
</head>
<body onload="buscar()">
    <header>
        <nav class="menu-de-navegacao">
            <nav class="logotipo">
                <img src="imagens/ui/cdm2.png">
            </nav>
            
            <a href="index.html">Home
                <img src="imagens/ui/casinha.png" alt="Home">
            </a>

            <a href="cardapio.html">Cardápio
                <img src="imagens/ui/menu.png" alt="Cardápio">
            </a>

            <a href="historia.html">Nossa História
                <img src="imagens/ui/pergaminho.png" alt="História">
            </a>
        </nav>
    </header>

    <main>
        <h1 class="titulo-menu">
            Menu
        </h1>


        <section class="busca">

            <input
                type="text"
                id="campo-busca"
                onkeydown="pressionouEnter(event)"
            >

            <button onclick="busca_personalizada()">
                Buscar
            </button>
        
        </section>

        <section id="cardapio">
        
        </section>

    </main>

    <script>

        function pressionouEnter(event) {
            if (event.key === "Enter") {
                busca_personalizada()
            }
        }

        async function busca_personalizada() {
            const campo = document.getElementById("campo-busca")
            const nome = campo.value

            const resposta = await fetch(`https://fastapi-cardapio-api.onrender.com/produtos?nome=${nome}`)
            const dados = await resposta.json()

            const div = document.getElementById("cardapio");
            div.innerHTML = "";
            
            if (dados.length === 0) {
                div.innerHTML = `
                <div class="erro">
                    <p>Não foi possível encontrar o alimento "${nome}".</p>
                </div>`
                return;
            }

            div.innerHTML = `
                <div class="categoria"></div>
            `;

            const categoria = document.querySelector(".categoria");

            dados.forEach(item => {
                categoria.innerHTML += `
                    <div class="produto">
                        <img class="imagem-produto" src="imagens/produtos/${item.imagem}">
                            
                            <div class="informacoes">
                                <strong>${item.nome}</strong><br>

                                <div class="descricao-produto">
                                    ${item.descricao}
                                </div>

                                <p class="preco">
                                    R$ ${Number(item.preco).toLocaleString(
                                        "pt-BR",
                                        { minimumFractionDigits: 2 }
                                    )}
                                </p>
                            </div>
                    </div>
                `;   
            });

        }

    </script>
    
    <script>
        async function buscar() {
            const resposta = await fetch("https://fastapi-cardapio-api.onrender.com/produtos");
            const dados = await resposta.json();

            const div = document.getElementById("cardapio");
            div.innerHTML = "";

            if (dados.length === 0) {
                div.innerHTML = "<p>Não foi possível carregar o cardápio. Tente novamente em 40 segundos.</p>";
                return;
            }

            dados.forEach(item => {
                let categoria = document.getElementById(`categoria-${item.categoria}`);

                if (categoria === null) {
                    div.innerHTML += `
                        <h2 class="titulo">
                            ${item.categoria}
                        </h2>
                        
                        <div class="categoria" id="categoria-${item.categoria}">

                        <div class="produto">
                            <img class="imagem-produto" src="imagens/produtos/${item.imagem}">
                                
                                <div class="informacoes">
                                    <strong>${item.nome}</strong><br>

                                    <div class="descricao-produto">
                                        ${item.descricao}
                                    </div>

                                    <p class="preco">
                                        R$ ${Number(item.preco).toLocaleString(
                                            "pt-BR",
                                            { minimumFractionDigits: 2 }
                                        )}
                                    </p>
                                </div>
                        </div>
                    `;  
                }
                
                else {
                    categoria.innerHTML += `
                        <div class="produto">
                            <img class="imagem-produto" src="imagens/produtos/${item.imagem}">
                                
                                <div class="informacoes">
                                    <strong>${item.nome}</strong><br>

                                    <div class="descricao-produto">
                                        ${item.descricao}
                                    </div>

                                    <p class="preco">
                                        R$ ${Number(item.preco).toLocaleString(
                                            "pt-BR",
                                            { minimumFractionDigits: 2 }
                                        )}
                                    </p>
                                </div>
                        </div>
                    `;
                }
            });
        }
    </script>
</body>
</html>

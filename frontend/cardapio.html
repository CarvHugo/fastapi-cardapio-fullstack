<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Cardápio</title>
</head>
<body id="pagina-cardapio" onload="carrega_produtos()">
    <header>
        <nav class="menu-de-navegacao">
            <nav class="logotipo">
                <img src="imagens/ui/cdm2.png">
            </nav>
        </nav>
    </header>

    <main>
        <h1 class="titulo-menu">
            Menu
        </h1>


        <section class="busca">

            <input
                type="text"
                id="campo-busca"
                onkeydown="pressionouEnter(event)"
            >

            <button onclick="buscar()">
                Buscar
            </button>
        
        </section>

        <section id="cardapio">
        
        </section>

        <section onclick="fechar_modal()" class="modal" id="modal">

        </section>

    </main>

    <script>

        var produtos = []

        function pressionouEnter(event) {
            if (event.key === "Enter") {
                buscar()
            }
        }

        let campo = document.getElementById("campo-busca")

        campo.addEventListener('input', function() {
            let nome = campo.value

            let sugestoes = produtos.filter((produto) => produto.nome.toLowerCase().includes(nome.toLowerCase()))
            
            console.log(sugestoes)
        })


        function abrir_modal(item) {
            const modal = document.getElementById("modal")

            modal.innerHTML = `
                            <div class="modal-container">
                                <img class="imagem-produto" src="imagens/produtos/${item.imagem}">
                                
                                <div class="informacoes">
                                    <strong>${item.nome}</strong><br>

                                    <div class="descricao-produto">
                                        ${item.descricao}
                                    </div>

                                    <p class="preco">
                                        R$ ${Number(item.preco).toLocaleString(
                                            "pt-BR",
                                            { minimumFractionDigits: 2 }
                                        )}
                                    </p>
                                </div>
                            </div>`

            modal.classList.add("aberto")
        }

        

        function buscar() {
            let nome = campo.value

            let resposta = produtos.filter((produto) => produto.nome.toLowerCase().includes(nome.toLowerCase())) 
            const dados = resposta

            const div = document.getElementById("cardapio");
            div.innerHTML = "";

            div.innerHTML = `
                <div class="categoria"></div>
            `;

            const categoria = document.querySelector(".categoria");

            dados.forEach(item => {
                categoria.innerHTML += `
                    <div class="produto">
                        <img class="imagem-produto" src="imagens/produtos/${item.imagem}">
                            
                            <div class="informacoes">
                                <strong>${item.nome}</strong><br>

                                <div class="descricao-produto">
                                    ${item.descricao}
                                </div>

                                <p class="preco">
                                    R$ ${Number(item.preco).toLocaleString(
                                        "pt-BR",
                                        { minimumFractionDigits: 2 }
                                    )}
                                </p>
                            </div>
                    </div>
                `;   
            });

        }

    </script>
    
    <script>
        async function carrega_produtos() {
            try {
                const resposta = await fetch("https://fastapi-cardapio-api.onrender.com/produtos");

                if (!resposta.ok) {
                    throw new Error("Erro ao carregar os produtos!");
                }

                const dados = await resposta.json();
                produtos.push(...dados)

                console.log(produtos)

                const div = document.getElementById("cardapio");
                div.innerHTML = "";

                if (dados.length === 0) {
                    div.innerHTML = "<p>Não foi possível carregar o cardápio. Tente novamente em 40 segundos.</p>";
                    return;
                }

                dados.forEach(item => {
                    let categoria = document.getElementById(`categoria-${item.categoria}`);

                    if (categoria === null) {
                        div.innerHTML += `
                            <h2 class="titulo">
                                ${item.categoria}
                            </h2>

                            <div class="categoria" id="categoria-${item.categoria}">

                                <div class="produto" data-id="${item.id}">
                                    <img class="imagem-produto" src="imagens/produtos/${item.imagem}">

                                    <div class="informacoes">
                                        <strong>${item.nome}</strong><br>

                                        <div class="descricao-produto">
                                            ${item.descricao}
                                        </div>

                                        <p class="preco">
                                            R$ ${Number(item.preco).toLocaleString(
                                                "pt-BR",
                                                { minimumFractionDigits: 2 }
                                            )}
                                        </p>
                                    </div>
                                </div>
                            </div>
                        `;
                    }

                    else {
                        categoria.innerHTML += `
                            <div class="produto" data-id="${item.id}">
                                <img class="imagem-produto" src="imagens/produtos/${item.imagem}">

                                <div class="informacoes">
                                    <strong>${item.nome}</strong><br>

                                    <div class="descricao-produto">
                                        ${item.descricao}
                                    </div>

                                    <p class="preco">
                                        R$ ${Number(item.preco).toLocaleString(
                                            "pt-BR",
                                            { minimumFractionDigits: 2 }
                                        )}
                                    </p>
                                </div>
                            </div>
                        `;
                    }
                });

            } catch (erro) {
                console.error(erro);

                document.getElementById("cardapio").innerHTML = `
                    <p class="erro">
                        Não foi possível carregar o cardápio.
                        Tente novamente mais tarde.
                    </p>
                `;
            }
        }
    </script>
</body>
</html>
